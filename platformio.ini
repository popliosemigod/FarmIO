; =====================================================================
;  FarmIO - vaso inteligente
;  Layout padrao PlatformIO: src/ include/ lib/ test/
;  Alvo: ESP32 DevKit V1 (ESP32-D0WD-V3, 4 MB)
;
;  Compilar:  pio run
;  Gravar:    pio run -t upload
;  Monitorar: pio device monitor -b 115200
; =====================================================================

[platformio]
default_envs = esp32dev

[env]
platform  = espressif32 @ ^6.9.0
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; esp32_exception_decoder traduz o backtrace de um panic em arquivo:linha.
; Sem ele, uma excecao vira endereco hexadecimal puro e o diagnostico morre.
monitor_filters =
    esp32_exception_decoder
    time

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DFARMIO_NOME='"farmio-01"'
    -DFARMIO_VERSAO='"0.1.0"'

; Versoes fixas de proposito: firmware que compila hoje precisa compilar
; igual daqui a seis meses, na maquina de outra pessoa e no CI.
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit NeoPixel @ ^1.12.3

; ---------------------------------------------------------------------
;  Ambiente de operacao.
; ---------------------------------------------------------------------
[env:esp32dev]
board = esp32dev

; ---------------------------------------------------------------------
;  Ambiente de bancada: mesmo firmware, log detalhado. Serve para
;  calibrar os limiares de solo e de tanque sem recompilar o de operacao.
; ---------------------------------------------------------------------
[env:bancada]
board = esp32dev
build_type = debug
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DFARMIO_BANCADA=1

; ---------------------------------------------------------------------
;  A biblioteca compartilhada do laboratorio (jaspa-core) ainda NAO e
;  usada aqui. O motivo esta no README: ela mora no repositorio Jaspy,
;  que e privado, e o caminho por symlink depende do layout de pastas da
;  maquina - o CI deste repositorio nao conseguiria resolver.
;
;  Para desenvolver localmente com ela, com o Jaspy clonado ao lado:
;    lib_deps = symlink://../Jaspy-main/firmware/jaspa-core
; ---------------------------------------------------------------------
