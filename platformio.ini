; =====================================================================
;  FarmIO - vaso inteligente
;  Layout padrao PlatformIO: src/ include/ lib/ test/
;
;  DUAS PLACAS, UM REPOSITORIO. O vaso roda no ESP32-C3 e a visao roda na
;  ESP32-CAM. Sao dois binarios diferentes que compartilham lib/ e
;  include/config.h - em especial o protocolo do enlace, que precisa ser
;  literalmente o mesmo codigo dos dois lados. Repositorio separado por
;  placa garantiria, mais cedo ou mais tarde, uma ponta com o quadro de
;  12 bytes e a outra com o de 14.
;
;  Ambiente     Placa          Para que serve
;  -----------  -------------  --------------------------------------
;  c3           ESP32-C3       o vaso: sensores, bomba, tela, web
;  cam          ESP32-CAM      camera: captura, classifica, responde
;  autoteste    ESP32-C3       treina e mede sem sensor e sem camera
;  bancada      ESP32-C3       o vaso com log detalhado, para calibrar
;  ensaio       ESP32-C3       bring-up de um sensor por vez, sem mais nada
;  esp32dev     DevKit V1      a placa da v0.1, mantida compilando
;
;  Compilar tudo:  pio run
;  Gravar o vaso:  pio run -e c3 -t upload
;  Gravar a cam:   pio run -e cam -t upload
;  Monitorar:      pio device monitor -e c3
; =====================================================================

[platformio]
; O CI compila os dois binarios que vao para a bancada. Enlace so quebra
; de um lado - compilar so um lado nao provaria nada.
default_envs = c3, cam

[env]
platform  = espressif32 @ ^6.9.0
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; esp32_exception_decoder traduz o backtrace de um panic em arquivo:linha.
; Sem ele, uma excecao vira endereco hexadecimal puro e o diagnostico morre.
monitor_filters =
    esp32_exception_decoder
    time

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DFARMIO_NOME='"farmio-01"'
    -DFARMIO_VERSAO='"0.2.0"'

; Versoes fixas de proposito: firmware que compila hoje precisa compilar
; igual daqui a seis meses, na maquina de outra pessoa e no CI.
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit NeoPixel @ ^1.12.3

; ---------------------------------------------------------------------
;  O VASO - ESP32-C3 (4 MB, USB-Serial/JTAG nativo)
;
;  ARDUINO_USB_CDC_ON_BOOT=1 nao e conforto: e ele que joga o console
;  para o USB nativo (GPIO18/19) e LIBERA a UART0 (GPIO20/21) para falar
;  com a ESP32-CAM. Sem isso, as duas coisas disputariam o mesmo par de
;  pinos e o log do vaso entraria como quadro na camera.
; ---------------------------------------------------------------------
[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DFARMIO_PLACA_C3=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_filter = +<*> -<main_cam.cpp> -<main_autoteste.cpp> -<cenas.cpp> -<main_ensaio.cpp>

; ---------------------------------------------------------------------
;  A CAMERA - ESP32-CAM AI-Thinker
;
;  huge_app: o binario leva driver de camera, Wi-Fi e servidor de video e
;  nao cabe na particao padrao de 1,3 MB.
;  A PSRAM e obrigatoria - sem ela nao ha buffer para QVGA continua.
; ---------------------------------------------------------------------
[env:cam]
board = esp32cam
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DFARMIO_PLACA_CAM=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
build_src_filter = +<main_cam.cpp>

; ---------------------------------------------------------------------
;  AUTOTESTE - roda no C3 que ja esta na bancada, sem nada ligado nele.
;  Exercita o enlace contra lixo e erro de bit, gera o banco de cenas
;  sinteticas, treina a regressao e imprime os pesos. Ver
;  docs/05-visao-planta.md.
; ---------------------------------------------------------------------
[env:autoteste]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DFARMIO_PLACA_C3=1
    -DFARMIO_AUTOTESTE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_filter = +<main_autoteste.cpp> +<cenas.cpp>

; ---------------------------------------------------------------------
;  Ambiente de bancada: mesmo firmware do vaso, log detalhado. Serve
;  para calibrar os limiares de solo e de tanque sem recompilar o de
;  operacao.
; ---------------------------------------------------------------------
[env:bancada]
board = esp32-c3-devkitm-1
build_type = debug
build_flags =
    ${env.build_flags}
    -DFARMIO_PLACA_C3=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DFARMIO_BANCADA=1
build_src_filter = +<*> -<main_cam.cpp> -<main_autoteste.cpp> -<cenas.cpp> -<main_ensaio.cpp>

; ---------------------------------------------------------------------
;  ENSAIO - bring-up de sensor, um subsistema por vez.
;
;  Sobe SO o DHT22 e o ADC do nivel: sem Wi-Fi, sem I2C, sem LED e sem
;  enlace. Quando um sensor nao responde no firmware completo, a lista de
;  suspeitos tem quinze nomes; aqui tem tres - o fio, o resistor e o
;  sensor. E o ambiente que transforma "nao funciona" em "nao funciona
;  por causa disto".
; ---------------------------------------------------------------------
[env:ensaio]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DFARMIO_PLACA_C3=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_filter = +<main_ensaio.cpp>

; ---------------------------------------------------------------------
;  A placa da v0.1. Nao esta na bancada, mas continua compilando: o dia
;  em que a pinagem do C3 apertar demais, e para ela que o projeto volta,
;  e firmware que passou seis meses sem compilar nao volta em uma tarde.
; ---------------------------------------------------------------------
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DFARMIO_PLACA_ESP32DEV=1
build_src_filter = +<*> -<main_cam.cpp> -<main_autoteste.cpp> -<cenas.cpp> -<main_ensaio.cpp>

; ---------------------------------------------------------------------
;  A biblioteca compartilhada do laboratorio (jaspa-core) ainda NAO e
;  usada aqui. O motivo esta no README: ela mora no repositorio Jaspy,
;  que e privado, e o caminho por symlink depende do layout de pastas da
;  maquina - o CI deste repositorio nao conseguiria resolver.
;
;  Para desenvolver localmente com ela, com o Jaspy clonado ao lado:
;    lib_deps = symlink://../Jaspy-main/firmware/jaspa-core
; ---------------------------------------------------------------------
