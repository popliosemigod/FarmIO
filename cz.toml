# =====================================================================
#  Commitizen - padrao de mensagem de commit do FarmIO
#
#  Uso:  cz commit      (monta a mensagem por perguntas)
#        cz check       (valida uma mensagem ja escrita)
#
#  Os tipos sao os mesmos do laboratorio (repositorio Jaspy,
#  docs/03-git-e-versionamento.md). O que muda e o escopo: aqui ele e o
#  subsistema do vaso, nao o nome do projeto - dentro do repositorio do
#  FarmIO, dizer "(farmio)" em todo commit nao informa nada.
# =====================================================================

[tool.commitizen]
name = "cz_customize"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.commitizen.customize]
schema = "<tipo>(<subsistema>): <descricao no imperativo>"
# String literal do TOML (aspas simples): o regex vai inteiro, sem escape
# duplicado. O final aceita corpo de varias linhas.
schema_pattern = '^(feat|hw|cad|fix|calib|test|doc|infra|chore)\((sensores|bomba|tela|led|web|config|firmware|hardware|docs|repo)\)!?: .{4,80}(\n[\s\S]*)?$'
message_template = "{{tipo}}({{subsistema}}): {{descricao}}{% if corpo %}\n\n{{corpo}}{% endif %}"
example = "calib(sensores): ajustar limiar de solo seco para 2870 medido em terra seca"
info = """
Tipos:  feat  hw  cad  fix  calib  test  doc  infra  chore
Escopo: sensores  bomba  tela  led  web  config  firmware  hardware  docs  repo
"""

bump_pattern = '^(feat|hw|fix|calib)'
bump_map = { feat = "MINOR", hw = "MINOR", fix = "PATCH", calib = "PATCH" }

[[tool.commitizen.customize.questions]]
type = "list"
name = "tipo"
message = "Tipo da mudanca"
choices = [
  { value = "feat",  name = "feat  - funcionalidade nova" },
  { value = "hw",    name = "hw    - esquematico, PCB, pinagem" },
  { value = "cad",   name = "cad   - modelagem 3D, peca do vaso" },
  { value = "fix",   name = "fix   - correcao de comportamento errado" },
  { value = "calib", name = "calib - parametro de calibracao medido na bancada" },
  { value = "test",  name = "test  - ensaio, rotina de teste, evidencia" },
  { value = "doc",   name = "doc   - documentacao" },
  { value = "infra", name = "infra - ambiente, toolchain, automacao" },
  { value = "chore", name = "chore - manutencao sem efeito no comportamento" },
]

[[tool.commitizen.customize.questions]]
type = "list"
name = "subsistema"
message = "Subsistema afetado"
choices = [
  { value = "sensores", name = "sensores - DHT22, umidade de solo, nivel do tanque" },
  { value = "bomba",    name = "bomba    - acionamento e intertravamento da irrigacao" },
  { value = "tela",     name = "tela     - display OLED" },
  { value = "led",      name = "led      - anel RGB de 16 pixels" },
  { value = "web",      name = "web      - servidor HTTP, JSON e video" },
  { value = "config",   name = "config   - pinagem, limiares, parametros" },
  { value = "firmware", name = "firmware - estrutura geral, boot, loop" },
  { value = "hardware", name = "hardware - montagem fisica, alimentacao" },
  { value = "docs",     name = "docs     - documentacao do projeto" },
  { value = "repo",     name = "repo     - repositorio, CI, hooks" },
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "descricao"
message = "Descricao no imperativo, minuscula, sem ponto final"

[[tool.commitizen.customize.questions]]
type = "input"
name = "corpo"
message = "Corpo (opcional) - por que da mudanca, numero medido, referencia de datasheet"
